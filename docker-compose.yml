volumes:
  db-data:

services:

  database:
    image: mysql:8.0
    restart: always
    ports:
      - 33063:3306
    environment:
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_RANDOM_ROOT_PASSWORD=yes
    command: --default-authentication-plugin=mysql_native_password --ssl=0
    volumes:
      - db-data:/var/lib/mysql
  drupal:
    build: .
    restart: always
    env_file: .env
    environment:
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_RANDOM_ROOT_PASSWORD=yes
      - MYSQL_HOSTNAME=${MYSQL_HOSTNAME}
      - MYSQL_PORT=${MYSQL_PORT}
      - DRUPAL_HASH_SALT=${DRUPAL_HASH_SALT}
      - MATOMO_CONTAINER_ID=${MATOMO_CONTAINER_ID}
    depends_on:
      - database
    ports:
      - 8081:80
    volumes:
      - './private:/var/www/private:rw,delegated'
      - './:/var/www:rw,delegated'
      - './mat.settings.php:/var/www/html/sites/default/settings.php:ro'
      - /var/www/vendor
      - /var/www/html/core
      - /var/www/html/modules/contrib
      - /var/www/html/themes/contrib
      - /var/www/html/profiles/contrib
